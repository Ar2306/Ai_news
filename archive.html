<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AR — archive of past AI/ML digests">
    <title>AR — Archive</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <div class="wrap">
        <header>
            <h1><a href="/">AR</a></h1>
            <p>Archive of past digests.</p>
        </header>

        <main>
            <div class="filters" id="filters" role="group" aria-label="Filter by tag"></div>
            <p class="status" id="status" aria-live="polite">Loading…</p>
            <div id="days"></div>
        </main>

        <footer>
            <a href="/">Latest</a> ·
            <a href="https://github.com/DavidGaso1/AI-News-Update" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </div>

    <script src="assets/site.js"></script>
    <script>
        const daysEl = document.getElementById('days');
        const status = document.getElementById('status');
        const filters = document.getElementById('filters');

        async function load() {
            try {
                const res = await fetch('data/archive.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const days = ((await res.json()).archive || []).filter(d => (d.articles || []).length);

                daysEl.innerHTML = days.map(day => `
                    <section class="day">
                        <h2>${escapeHtml(formatDate(day.date + 'T12:00:00') || day.date)}</h2>
                        ${day.articles.map(renderArticle).join('')}
                    </section>`).join('');

                const all = days.flatMap(d => d.articles);
                const setStatus = (n) => {
                    status.textContent = `${n} item${n === 1 ? '' : 's'} across ${days.length} day${days.length === 1 ? '' : 's'}`;
                };

                renderTagFilters(filters, all, tag => {
                    setStatus(applyTagFilter(daysEl, tag));
                    // Hide days with nothing left to show
                    daysEl.querySelectorAll('.day').forEach(sec => {
                        sec.hidden = !sec.querySelector('.item:not([hidden])');
                    });
                });
                setStatus(all.length);
            } catch (err) {
                status.textContent = `Couldn't load the archive (${err.message}).`;
            }
        }

        load();
    </script>
</body>
</html>
