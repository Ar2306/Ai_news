name: Tests

on:
  push:
    branches: [master]
  pull_request:

# CI only reads the repo; never give PR code a write token
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python sources
        run: python3 -m compileall -q scripts

      - name: Front-end syntax check
        run: node --check assets/app.js

      - name: Import smoke test
        run: python3 -c "import feedparser, httpx, bs4, lxml, dateutil; print('dependencies OK')"

      - name: Validate newsletter data
        run: |
          python3 - <<'EOF'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('fetch_news', 'scripts/fetch-news.py')
          fetch_news = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fetch_news)
          TAGS = set(fetch_news.TOPIC_TAGS)

          def check_article(a, where):
              assert 'category' not in a, f'{where}: stale "category" field'
              assert isinstance(a.get('tags'), list) and 1 <= len(a['tags']) <= 3, f'{where}: tags must be a list of 1-3'
              bad = set(a['tags']) - TAGS
              assert not bad, f'{where}: tags outside TOPIC_TAGS: {bad}'
              s = a.get('summary')
              assert isinstance(s, dict), f'{where}: summary must be an object'
              for k in ('what', 'why', 'who'):
                  assert isinstance(s.get(k), str), f'{where}: summary.{k} must be a string'
              # Newer fields are optional so older archive days stay valid
              if 'importance' in a:
                  assert isinstance(a['importance'], int) and 1 <= a['importance'] <= 5, f'{where}: importance must be 1-5'
              assert isinstance(a.get('links', {}), dict), f'{where}: links must be an object'
              assert isinstance(a.get('discussions', []), list), f'{where}: discussions must be a list'
              for k in ('content', 'signal', 'external_url', 'discussion'):
                  assert k not in a, f'{where}: internal field {k!r} leaked into JSON'

          p = 'data/newsletter.json'
          assert os.path.exists(p), f'{p} is missing'
          d = json.load(open(p))
          for key in ('generated_at', 'article_count', 'all_articles'):
              assert key in d, f'{p} is missing key {key!r}'
          assert 'categories' not in d, f'{p} still has the old "categories" key'
          assert isinstance(d['all_articles'], list), 'all_articles must be a list'
          assert d['article_count'] == len(d['all_articles']), \
              f'article_count {d["article_count"]} != actual {len(d["all_articles"])}'
          for i, a in enumerate(d['all_articles']):
              check_article(a, f'{p} all_articles[{i}]')

          p = 'data/archive.json'
          for day in json.load(open(p)).get('archive', []):
              assert 'categories' not in day, f'{p} {day["date"]}: stale "categories" key'
              for i, a in enumerate(day['articles']):
                  check_article(a, f'{p} {day["date"]}[{i}]')

          print(f'newsletter.json OK — {len(d["all_articles"])} articles from {d["generated_at"]}')
          EOF

      - name: Curation parsing + fallback checks
        run: |
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fetch_news', 'scripts/fetch-news.py')
          fn = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fn)

          # 1. Valid reply: unknown tags are dropped, max 3 kept, who defaults to Unknown
          r = fn.parse_curation('{"relevant": true, "tags": ["llm", "made-up", "robotics", "multimodal", "other"],'
                                ' "summary": {"what": "A model.", "why": "Faster.", "who": ""}}')
          assert r['tags'] == ['llm', 'robotics', 'multimodal'], r
          assert r['summary']['who'] == 'Unknown', r

          # 2. Fenced JSON is tolerated; irrelevant items collapse to relevant=false
          assert fn.parse_curation('```json\n{"relevant": false}\n```') == {'relevant': False}

          # 3. Malformed replies raise so the caller falls back
          for bad in ('not json', '{"tags": []}', '{"relevant": true, "tags": ["llm"]}'):
              try:
                  fn.parse_curation(bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f'should reject {bad!r}')

          # 4. curate(): provider chain Gemini -> Ollama -> extractive fallback
          class Fake:
              def __init__(self, name, fn_):
                  self.name, self.generate, self.failures, self.disabled = name, fn_, 0, False
          def boom(prompt): raise RuntimeError('api down')
          f = object.__new__(fn.NewsFetcher)
          art = lambda: fn.Article(title='New RLHF method', url='u', source='s', author='Lab',
                                   content='We propose a reward model for reinforcement learning. It beats PPO baselines.')

          f.providers = [Fake('Gemini', lambda p: '{"relevant": false}')]
          assert f.curate(art()) is None, 'irrelevant item must be dropped'

          ok = '{"relevant": true, "tags": ["robotics"], "summary": {"what": "From fallback provider.", "why": "", "who": "X"}}'
          f.providers = [Fake('Gemini', boom), Fake('Ollama Cloud', lambda p: ok)]
          a = f.curate(art())
          assert a.summary['what'] == 'From fallback provider.' and f.providers[0].failures == 1, 'second provider must be used'

          f.providers = [Fake('Gemini', boom), Fake('Ollama Cloud', boom)]
          a = f.curate(art())
          assert a is not None and a.tags and set(a.tags) <= set(fn.TOPIC_TAGS), a.tags
          assert a.summary['what'].startswith('We propose'), a.summary
          assert 'content' not in a.to_dict(), 'raw content must not be serialized'

          print('Curation checks OK')
          EOF

      - name: Source pipeline checks (dedup, discussions, balance, importance, feed)
        run: |
          python3 - <<'EOF'
          import importlib.util, json, tempfile, xml.dom.minidom
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('fetch_news', 'scripts/fetch-news.py')
          fn = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fn)
          A = fn.Article

          # 1. importance is parsed, clamped, and defaults to 3
          base = '{"relevant": true, "tags": ["llm"], "summary": {"what": "w", "why": "y", "who": "z"}%s}'
          assert fn.parse_curation(base % ', "importance": 5')['importance'] == 5
          assert fn.parse_curation(base % ', "importance": 9')['importance'] == 5
          assert fn.parse_curation(base % ', "importance": "x"')['importance'] == 3
          assert fn.parse_curation(base % '')['importance'] == 3

          # 2. dedupe: paper kept once; the HN thread about it becomes a discussion link
          f = object.__new__(fn.NewsFetcher)
          f.seen_urls, f.seen_titles, f.run_urls, f.run_titles = {'https://old.example.com/x'}, set(), {}, {}
          items = [
              A(title='Great New Paper', url='https://arxiv.org/abs/2609.00001', source='arXiv cs.LG', group='arxiv'),
              A(title='Great new paper (HN)', url='https://arxiv.org/abs/2609.00001', source='Hacker News', group='community',
                external_url='https://arxiv.org/abs/2609.00001', signal=500,
                discussion={'source': 'Hacker News', 'url': 'https://news.ycombinator.com/item?id=1', 'points': 500}),
              A(title='Great New Paper', url='https://huggingface.co/papers/2609.00001', source='Hugging Face Papers', group='papers', signal=80),
              A(title='Covered yesterday', url='https://old.example.com/x', source='Blog', group='blogs'),
          ]
          kept = f.dedupe(items)
          assert len(kept) == 1 and kept[0].group == 'papers', [k.source for k in kept]
          assert [d['source'] for d in kept[0].discussions] == ['Hacker News'], kept[0].discussions

          # 3. select_candidates respects group and per-source caps
          many = [A(title=f'arxiv {i}', url=f'https://arxiv.org/abs/{i}', source=f'arXiv {i % 2}', group='arxiv') for i in range(40)]
          many += [A(title=f'lab {i}', url=f'https://lab/{i}', source='Lab', group='labs') for i in range(10)]
          picked = f.select_candidates(many)
          assert sum(a.group == 'arxiv' for a in picked) == 2 * fn.PER_SOURCE_CAP, 'per-source cap'
          assert sum(a.group == 'labs' for a in picked) == fn.PER_SOURCE_CAP
          assert picked[0].group != picked[1].group, 'round-robin across groups'

          # 4. community signals raise importance
          a = A(title='t', url='u', source='HF', group='papers', signal=120)
          f.providers = []
          f.llm_stats = {}
          assert f.curate(a).importance >= 4

          # 5. links + RSS feed
          assert fn.paper_links('https://arxiv.org/abs/2609.12345v2', 'Code: https://github.com/org/repo.')['code'] == 'https://github.com/org/repo'
          out = Path(tempfile.mkdtemp()) / 'feed.xml'
          evil = A(title='<b>x</b> & y', url='javascript:alert(1)', source='S', tags=['llm'], summary={'what': '<script>', 'why': '', 'who': ''})
          fn.write_feed(out, [evil], '2026-01-01T00:00:00+00:00')
          xml.dom.minidom.parseString(out.read_bytes())
          assert 'javascript:' not in out.read_text(), 'unsafe link in feed'
          print('Source pipeline checks OK')
          EOF

      - name: Digest link safety check
        run: |
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location('send_digest', 'scripts/send_digest.py')
          sd = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sd)
          assert sd.safe_url('javascript:alert(1)') == '#'
          assert sd.safe_url(' data:text/html,x') == '#'
          assert sd.safe_url('https://arxiv.org/abs/1') == 'https://arxiv.org/abs/1'
          data = {'generated_at': '2026-01-01T00:00:00+00:00', 'article_count': 1, 'all_articles': [
              {'title': '<script>x</script>', 'url': 'javascript:alert(1)', 'source': 's', 'tags': ['llm'],
               'summary': {'what': '<img src=x onerror=1>', 'why': '', 'who': ''}, 'published_at': '2026-01-01'}]}
          out = sd.build_html(sd.build_stories(data), data) + sd.build_telegram(data)
          assert 'javascript:' not in out and '<script>' not in out and '<img' not in out, out
          print('Digest link safety OK')
          EOF

      - name: Digest dry-run (builds email + Telegram, sends nothing)
        run: python3 scripts/send_digest.py --dry-run

      - name: Dedup logic unit checks
        run: |
          python3 - <<'EOF'
          import importlib.util

          # fetch-news.py has a hyphen, so load it via importlib. It has a
          # __main__ guard, so importing is side-effect free.
          spec = importlib.util.spec_from_file_location('fetch_news', 'scripts/fetch-news.py')
          fetch_news = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fetch_news)

          # Build a fetcher without touching the network (skip __init__)
          f = object.__new__(fetch_news.NewsFetcher)
          f.seen_urls = set()
          f.seen_titles = set()

          # 1. Retweet prefixes must be stripped so RT and original dedup together
          assert f._normalize_title('RT @aixbt: Apple releases M5 chip') == \
                 f._normalize_title('Apple releases M5 chip'), 'RT prefix not stripped'
          assert f._normalize_title('RT by @bot: OpenAI launches o5') == \
                 f._normalize_title('OpenAI launches o5'), 'RT by prefix not stripped'
          assert f._normalize_title('R to @x: Claude 4 is out') == \
                 f._normalize_title('Claude 4 is out'), 'R to prefix not stripped'

          # 2. Near-duplicate titles must be caught across sources
          # (_is_title_duplicate returns True when the title IS a duplicate)
          assert not f._is_title_duplicate('OpenAI announces GPT-5.5 Turbo'), 'first title should be accepted'
          assert f._is_title_duplicate('OpenAI announces GPT-5.5 Turbo'), 'exact duplicate must be caught'
          assert f._is_title_duplicate('OpenAI announces GPT-5.5 Turbo! (updated)'), 'near duplicate must be caught'
          assert not f._is_title_duplicate('Meta shows off AR glasses'), 'different story must pass'

          # 3. URL normalization catches tracking-param duplicates
          # (_is_duplicate returns True when the URL IS a duplicate)
          assert not f._is_duplicate('https://x.com/a/123?utm_source=twitter&s=09'), 'first url should be accepted'
          assert f._is_duplicate('https://x.com/a/123/'), 'tracking param / slash dup must be caught'

          print('Dedup unit checks OK')
          EOF

      - name: Cross-day dedup + archive merge checks
        run: |
          python3 - <<'EOF'
          import importlib.util, json, tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('fetch_news', 'scripts/fetch-news.py')
          fetch_news = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fetch_news)

          # 1. load_archive_seen seeds URLs/titles from a previous day's archive
          fake = Path(tempfile.mkdtemp()) / 'archive.json'
          # Use today's date: a hardcoded date eventually falls outside DEDUP_ARCHIVE_DAYS
          from datetime import date
          fake.write_text(json.dumps({'archive': [{'date': date.today().isoformat(), 'articles': [
              {'url': 'https://x.com/a/123?utm_source=twitter&s=09', 'title': 'OpenAI announces GPT-5.5 Turbo'},
              {'url': 'https://arxiv.org/abs/2608.05000', 'title': 'RT by @bot: Claude 4 is out'},
          ]}]}))
          seen_urls, seen_titles = fetch_news.load_archive_seen(fake)
          assert 'https://x.com/a/123' in seen_urls, 'tracking-param URL not normalized from archive'
          assert 'claude 4 is out' in seen_titles, 'RT prefix not stripped in archive titles'

          # 2. A story that resurfaced today must be blocked (cross-day dedup)
          f = object.__new__(fetch_news.NewsFetcher)
          f.seen_urls = set(seen_urls)
          f.seen_titles = set(seen_titles)
          assert f._is_duplicate('https://x.com/a/123?s=09'), 'cross-day URL dup not caught'
          assert f._is_title_duplicate('OpenAI announces GPT-5.5 Turbo!'), 'cross-day title dup not caught'
          assert not f._is_title_duplicate('Meta shows off AR glasses'), 'new story wrongly blocked'

          # 3. build_archive_index preserves previous days when rebuilding
          conn = fetch_news.init_database(':memory:')
          conn.execute(
              "INSERT INTO articles (title, url, source, summary, published_at, fetched_at, author, tags, date_key) "
              "VALUES ('today story', 'https://example.com/today', 'x', '{\"what\": \"w\", \"why\": \"y\", \"who\": \"z\"}', "
              "'2026-08-12', 'now', NULL, '[\"llm\"]', '2026-08-12')")
          out = Path(tempfile.mkdtemp()) / 'archive.json'
          out.write_text(json.dumps({'generated_at': 'x', 'archive': [{'date': '2026-08-10', 'total': 5, 'tags': {}, 'articles': []}]}))
          fetch_news.build_archive_index(conn, out)
          rebuilt = json.loads(out.read_text())
          dates = [d['date'] for d in rebuilt['archive']]
          assert '2026-08-10' in dates and '2026-08-12' in dates, f'archive history lost: {dates}'
          assert dates == sorted(dates, reverse=True), f'archive not sorted desc: {dates}'
          today = next(d for d in rebuilt['archive'] if d['date'] == '2026-08-12')
          assert today['tags'] == {'llm': 1} and today['articles'][0]['summary']['what'] == 'w', today

          print('Cross-day dedup + archive merge checks OK')
          EOF
