<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AR — a daily digest of AI/ML research and releases">
    <title>AR</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <div class="wrap">
        <header>
            <h1><a href="/">AR</a></h1>
            <p>A daily digest of AI/ML research and releases.</p>
        </header>

        <main>
            <div class="filters" id="filters" role="group" aria-label="Filter by tag"></div>
            <p class="status" id="status" aria-live="polite">Loading…</p>
            <div id="list"></div>
        </main>

        <footer>
            <a href="archive.html">Archive</a> ·
            <a href="https://github.com/DavidGaso1/AI-News-Update" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </div>

    <script src="assets/site.js"></script>
    <script>
        const list = document.getElementById('list');
        const status = document.getElementById('status');
        const filters = document.getElementById('filters');

        async function load() {
            try {
                const res = await fetch('data/newsletter.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const articles = (data.all_articles || [])
                    .slice()
                    .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

                const updated = formatDate(data.generated_at);
                const setStatus = (n) => {
                    status.textContent = `${n} item${n === 1 ? '' : 's'}${updated ? ` · updated ${updated}` : ''}`;
                };

                list.innerHTML = articles.map(renderArticle).join('');
                renderTagFilters(filters, articles, tag => setStatus(applyTagFilter(list, tag)));
                setStatus(articles.length);
            } catch (err) {
                status.textContent = `Couldn't load the digest (${err.message}).`;
            }
        }

        load();
    </script>
</body>
</html>
